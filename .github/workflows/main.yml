name: HarBest forecast

on:
  schedule:
    - cron: "17 * * * *"      # every hour at :17 (UTC; hourly is the same anywhere)
  workflow_dispatch:           # adds the "Run workflow" button

concurrency:
  group: harbest-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Pull latest readings from Supabase
        run: python fetch_readings.py --out sensor_readings_live.csv
      - name: Train, forecast and push to Supabase
        run: python harbest_forecast_pipeline.py --csv sensor_readings_live.csv --out output --push
      - name: Keep this run's report and chart
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: forecast-${{ github.run_number }}
          path: output/
          retention-days: 14
